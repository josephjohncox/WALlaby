site_name: WALlaby
site_description: PostgreSQL change data capture with composable Go connectors
site_url: https://josephjohncox.github.io/WALlaby/
repo_url: https://github.com/josephjohncox/WALlaby
repo_name: josephjohncox/WALlaby
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorial:
      - Replicate your first table: getting-started/quickstart.md
  - Concepts:
      - Core model: concepts/core-model.md
      - Architecture: architecture.md
      - Flow lifecycle: concepts/lifecycle.md
      - Delivery and checkpoints: concepts/delivery.md
      - Authority and fencing: concepts/authority-and-fencing.md
      - Managed delivery semantics: concepts/delivery-semantics.md
      - PostgreSQL bootstrap: concepts/postgres-bootstrap.md
      - Canonical artifact log: concepts/artifact-log.md
  - How-to guides:
      - Manage flows: guides/flows.md
      - Consume streams: streams.md
      - Choose a runtime: deployment/index.md
  - Operations:
      - Configuration: operations/configuration.md
      - Upgrading: operations/upgrading.md
      - Recovery: operations/recovery.md
      - Durable recovery runbooks: operations/durable-recovery-runbooks.md
      - S3 retention and object lock: operations/s3-retention-and-object-lock.md
      - Observability: observability.md
      - Runbooks: runbooks.md
  - Connectors:
      - Overview: connectors/index.md
      - Support matrix: reference/generated/connector-support.md
      - PostgreSQL: connectors/postgres.md
      - PostgreSQL managed profile: connectors/postgres-managed-profile.md
      - Iceberg: connectors/iceberg.md
      - ClickHouse: connectors/clickhouse.md
      - Snowflake: connectors/snowflake.md
      - Extended connector notes: connectors.md
  - Reference:
      - Overview: reference/index.md
      - Configuration and options: usage.md
      - gRPC and Protobuf: reference/generated/grpc.md
      - Go API:
          - certify: reference/generated/go/certify.md
          - connector: reference/generated/go/connector.md
          - pgstream: reference/generated/go/pgstream.md
          - schemaregistry: reference/generated/go/schemaregistry.md
          - spec: reference/generated/go/spec.md
          - stream: reference/generated/go/stream.md
          - wire: reference/generated/go/wire.md
  - Development:
      - Contributor guide: development/index.md
      - Durable core implementation report: implementation/durable-core.md
      - Process-failure matrix and soak: development/failure-matrix.md
      - Formal verification: specs.md
      - Benchmarks: benchmarks.md
