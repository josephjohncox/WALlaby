name: postgres_to_http_typed
wire_format: json
parallelism: 2
source:
  name: postgres_source
  type: postgres
  options:
    dsn: postgres://wallaby:example@localhost:5432/app?sslmode=disable
    slot: wallaby_http_typed
    publication: wallaby_http_typed
    batch_size: "500"
    batch_timeout: 1s
    status_interval: 10s
    create_slot: "true"
    format: json
destinations:
  - name: webhook_typed
    type: http
    options:
      url: https://webhook.example.test/v1/events
      method: POST
      format: json
      payload_mode: record_json
      timeout: 7s
      headers: '"X-Labels: alpha,beta","Authorization: Bearer example-token"'
      max_retries: "4"
      backoff_base: 150ms
      backoff_max: 3s
      backoff_factor: "1.75"
      dedupe_window: 10m
      type_mappings_file: examples/type-mappings/web.yaml
config:
  ack_policy: all
  table_mappings_file: ../mappings/http_typed.yaml
