config:
  ack_policy: all
  table_mappings:
    version: 2
    destinations:
      - destination: webhook_typed
        future_tables:
          action: include
          target_schema: "web_{{ .Schema }}_archive"
          target_table: "event_{{ .Table }}_v1"
          future_columns:
            action: include
            target_column: "field_{{ .Column }}_raw"
          write:
            mode: append
            key_columns: []
        tables: []
destinations:
  - name: webhook_typed
    http:
      dedupe_window: 600s
      format: WIRE_FORMAT_JSON
      headers:
        authorization: Bearer example-token
        x-labels: alpha,beta
      method: POST
      payload_mode: PAYLOAD_MODE_RECORD_JSON
      retry:
        backoff_base: 0.150s
        backoff_factor: 1.75
        backoff_max: 3s
        max_retries: 4
      timeout: 7s
      type_mappings:
        mappings:
          bytea: base64_string
          double precision: number
          jsonb: object
          timestamp with time zone: string
      url: https://webhook.example.test/v1/events
name: postgres_to_http_typed
parallelism: 2
source:
  name: postgres_source
  postgres_source:
    mode: POSTGRES_SOURCE_MODE_CDC
    batch_size: 500
    batch_timeout: 1s
    connection:
      dsn: postgres://wallaby:example@localhost:5432/app?sslmode=disable
    create_slot: true
    format: WIRE_FORMAT_JSON
    publication: wallaby_http_typed
    publication_schemas:
      - public
    slot: wallaby_http_typed
    status_interval: 10s
wire_format: json
