services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: wallaby
      POSTGRES_PASSWORD: wallaby
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallaby -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
