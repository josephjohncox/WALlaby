  NoAckWithoutDeliver
  AckMonotonic
  CheckpointMonotonic
  ReadAheadBounded
  RetryBounds
  DDLAppliedAfterApproval
  DDLGatedPausesFlow
  FlowTransitionsValid

PROPERTY
  AckNeverRegresses
  CheckpointNeverRegresses
  DurableBeforeAck
