SPECIFICATION Spec

CONSTANTS
  MaxLSN = 3
  MaxRetries = 1
  GateDDL = TRUE
  DDLSet = {2}
  FailureMode = "HoldSlot"
  GiveUpMode = "OnRetryExhaustion"

INVARIANTS
