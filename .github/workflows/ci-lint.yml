---
name: CI Lint

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise


      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ hashFiles('mise.toml') }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ hashFiles('mise.toml') }}-build-
            ${{ hashFiles('go.sum') }}


      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache/save v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Generate protobufs
        run: mise run proto

      - name: Go format check
        run: mise run format:check

      - name: Lint
        run: mise run lint

      - name: Govulncheck
        run: mise run security

      - name: Staticcheck
        run: mise run staticcheck

      - name: Proto lint
        run: mise run proto-lint

      - name: Proto breaking
        run: mise run proto-breaking
        env:
          # The checked-in allowlist is cumulative for the aggregate stack, so
          # always compare it with main rather than only the immediate PR base.
          BUF_BREAKING_REF: refs/remotes/origin/main

      - name: Durable-core PR contracts
        run: mise run test-durable-pr

      - name: Durable-core race detector
        run: mise run test-durable-race

      - name: Production-linked protocol and mutation gates
        run: mise run test-protocol

      - name: Rapid property tests
        run: mise run test-rapid

      - name: Unit tests with completeness accounting
        run: |
          go test ./tools/testcomplete
          mise run test

      - name: Upload machine-readable Go test results
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-test-results
          path: .cache/test-results/
          if-no-files-found: error

      - name: Helm chart checks
        run: ./scripts/helm-check.sh

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache/save v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}

  terraform-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Test nested Terraform provider module
        working-directory: terraform/provider
        run: go test ./...

      - name: Verify nested Terraform provider module is tidy
        working-directory: terraform/provider
        run: |
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum
