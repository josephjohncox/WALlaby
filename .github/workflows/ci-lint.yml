---
name: CI Lint

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        id: setup-go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Setup Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache v4.3.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache v4.3.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Install golangci-lint
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/golangci-lint ]; then
            go install \
              github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          fi
          echo "$PWD/.cache/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/govulncheck ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          fi

      - name: Install staticcheck
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          fi

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Verify nested Avro compatibility shim
        run: just avro-shim-check

      - name: Generate protobufs
        run: just proto

      - name: Go format check
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Govulncheck
        run: govulncheck ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Proto lint
        run: just proto-lint

      - name: Proto breaking
        run: just proto-breaking
        env:
          # The checked-in allowlist is cumulative for the aggregate stack, so
          # always compare it with main rather than only the immediate PR base.
          BUF_BREAKING_REF: refs/remotes/origin/main

      - name: Durable-core PR contracts
        run: just test-durable-pr

      - name: Durable-core race detector
        run: just test-durable-race

      - name: Rapid property tests
        run: just test-rapid

      - name: Unit tests with completeness accounting
        run: |
          go test ./tools/testcomplete
          just test

      - name: Upload machine-readable Go test results
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-test-results
          path: .cache/test-results/
          if-no-files-found: error

      - name: Helm chart checks
        run: ./scripts/helm-check.sh

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}

  terraform-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: terraform/provider/go.mod
          cache-dependency-path: terraform/provider/go.sum

      - name: Test nested Terraform provider module
        working-directory: terraform/provider
        run: go test ./...

      - name: Verify nested Terraform provider module is tidy
        working-directory: terraform/provider
        run: |
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum
