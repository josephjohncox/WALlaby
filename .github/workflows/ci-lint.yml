name: CI Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        id: setup-go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Setup Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Install golangci-lint
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/golangci-lint ]; then
            go install \
              github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          fi
          echo "$PWD/.cache/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/govulncheck ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          fi

      - name: Install staticcheck
        run: |
          mkdir -p .cache/bin
          if [ ! -x .cache/bin/staticcheck ]; then
            go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          fi

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Generate protobufs
        run: just proto

      - name: Lint
        run: just lint

      - name: Govulncheck
        run: govulncheck ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Proto lint
        run: just proto-lint

      - name: Proto breaking
        run: just proto-breaking
        env:
          BUF_BREAKING_REF: ${{ github.event.pull_request.base.sha }}

      - name: Unit tests
        run: RAPID_CHECKS=100 just test-rapid

      - name: Helm chart checks
        run: ./scripts/helm-check.sh

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}

  terraform-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: terraform/provider/go.mod
          cache-dependency-path: terraform/provider/go.sum

      - name: Test nested Terraform provider module
        working-directory: terraform/provider
        run: go test ./...

      - name: Verify nested Terraform provider module is tidy
        working-directory: terraform/provider
        run: |
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum
