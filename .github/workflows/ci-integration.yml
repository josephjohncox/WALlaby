name: CI Integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        id: setup-go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Generate protobufs
        run: just proto

      - name: PostgreSQL-backed store contract tests
        env:
          POSTGRES_CONTRACT_PORT: >-
            ${{ job.services.postgres.ports['5432'] }}
        run: |
          TEST_PG_DSN=$(
            printf '%s:%s@localhost:%s/%s?sslmode=disable' \
              'postgres://postgres' \
              'postgres' \
              "${POSTGRES_CONTRACT_PORT}" \
              'postgres'
          )
          export TEST_PG_DSN
          set +e
          output=$(go test -count=1 -v \
            ./connectors/sources/postgres \
            ./internal/checkpoint \
            ./internal/registry \
            ./internal/workflow \
            ./pkg/schemaregistry)
          test_rc=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${test_rc}" -ne 0 ]; then
            exit "${test_rc}"
          fi
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresStoreRejectsCheckpointRegression'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresLifecycleStoreContract'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresRegistryConcurrentRegistration'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestBackfillHashPartitionsCoverEveryRow'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresDDLExecutionReceiptsGateAppliedStatus'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresDDLPreparationSerializesStatus'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresCatalogChangeAllocatesVersions'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresCatalogChangeSerializesVersions'

      - name: Start integration PostgreSQL
        run: |
          docker run --detach \
            --name wallaby-integration-postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            --publish 127.0.0.1::5432 \
            postgres:16-alpine \
            -c wal_level=logical
          postgres_port=$(docker port wallaby-integration-postgres 5432/tcp \
            | awk -F: '{print $NF}')
          test -n "${postgres_port}"
          for attempt in $(seq 1 60); do
            if docker exec wallaby-integration-postgres \
              pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs wallaby-integration-postgres >&2
              echo 'integration PostgreSQL did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          test_pg_dsn=$(
            printf '%s:%s@localhost:%s/%s?sslmode=disable' \
              'postgres://postgres' \
              'postgres' \
              "${postgres_port}" \
              'postgres'
          )
          printf 'TEST_PG_DSN=%s\n' "${test_pg_dsn}" >> "${GITHUB_ENV}"
          printf 'WALLABY_TEST_DBOS_DSN=%s\n' "${test_pg_dsn}" \
            >> "${GITHUB_ENV}"

      - name: Integration tests (PostgreSQL, ClickHouse, DBOS, Kubernetes)
        env:
          WALLABY_TEST_K8S_NAMESPACE: default
        run: just test-integration-ci

      - name: Stop integration PostgreSQL
        if: always()
        run: docker rm --force wallaby-integration-postgres || true

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}
