name: CI Integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        id: setup-go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Generate protobufs
        run: just proto

      - name: PostgreSQL-backed store contract tests
        env:
          POSTGRES_CONTRACT_PORT: >-
            ${{ job.services.postgres.ports['5432'] }}
        run: |
          TEST_PG_DSN=$(
            printf '%s:%s@localhost:%s/%s?sslmode=disable' \
              'postgres://postgres' \
              'postgres' \
              "${POSTGRES_CONTRACT_PORT}" \
              'postgres'
          )
          export TEST_PG_DSN
          set +e
          output=$(go test -count=1 -v \
            ./connectors/sources/postgres \
            ./internal/checkpoint \
            ./internal/registry \
            ./internal/workflow \
            ./pkg/schemaregistry)
          test_rc=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${test_rc}" -ne 0 ]; then
            exit "${test_rc}"
          fi
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresStoreRejectsCheckpointRegression'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresLifecycleStoreContract'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresRegistryConcurrentRegistration'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestBackfillHashPartitionsCoverEveryRow'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresDDLExecutionReceiptsGateAppliedStatus'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresDDLPreparationSerializesStatus'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresCatalogChangeAllocatesVersions'
          printf '%s\n' "${output}" | grep -q -- \
            '--- PASS: TestPostgresCatalogChangeSerializesVersions'

          migration_results=$(mktemp)
          trap 'rm -f "${migration_results}"' EXIT
          migration_filter='^('
          migration_filter+='TestRegistryOnlyLedgerIsRepairedByCentralizedMigration'
          migration_filter+='|TestManagedAuthoritySchemaVerificationFailsClosed'
          migration_filter+=')$'
          required_migrations=
          required_migrations+='TestRegistryOnlyLedgerIsRepairedByCentralizedMigration'
          required_migrations+=',TestManagedAuthoritySchemaVerificationFailsClosed'
          go test -count=1 -run "${migration_filter}" \
            -json ./internal/controlplane >"${migration_results}"
          cat "${migration_results}"
          go run ./scripts/verify-go-test-json.go \
            -results "${migration_results}" \
            -required "${required_migrations}"

      - name: Start integration PostgreSQL
        run: |
          docker run --detach \
            --name wallaby-integration-postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            --publish 127.0.0.1::5432 \
            postgres:16-alpine \
            -c wal_level=logical
          postgres_port=$(docker port wallaby-integration-postgres 5432/tcp \
            | awk -F: '{print $NF}')
          test -n "${postgres_port}"
          for attempt in $(seq 1 60); do
            if docker exec wallaby-integration-postgres \
              pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs wallaby-integration-postgres >&2
              echo 'integration PostgreSQL did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          test_pg_dsn=$(
            printf '%s:%s@localhost:%s/%s?sslmode=disable' \
              'postgres://postgres' \
              'postgres' \
              "${postgres_port}" \
              'postgres'
          )
          printf 'TEST_PG_DSN=%s\n' "${test_pg_dsn}" >> "${GITHUB_ENV}"
          printf 'WALLABY_TEST_DBOS_DSN=%s\n' "${test_pg_dsn}" \
            >> "${GITHUB_ENV}"

      - name: Integration tests (PostgreSQL, ClickHouse, DBOS, Kubernetes)
        env:
          WALLABY_TEST_K8S_NAMESPACE: default
        run: just test-integration-ci

      - name: Required durable seam behavior (PostgreSQL + MinIO, no skips)
        if: github.event_name != 'schedule'
        run: just test-durable-seams

      - name: Required checkpoint-1 worker and DBOS evidence (no skips)
        if: github.event_name != 'schedule'
        run: just test-checkpoint1-integration

      - name: Required managed ClickHouse profile evidence (no skips)
        run: just test-clickhouse-managed-profile

      - name: Nightly durability and repeated recovery evidence
        if: github.event_name == 'schedule'
        run: just test-durable-nightly

      - name: Stop integration PostgreSQL
        if: always()
        run: docker rm --force wallaby-integration-postgres || true

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}

  checkpoint5-iceberg:
    name: checkpoint5-iceberg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Required checkpoint-5 Iceberg REST evidence (no skips)
        run: just test-checkpoint5-iceberg-integration

  postgres-managed-profile:
    name: postgres-managed-profile-${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17]
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Start PostgreSQL ${{ matrix.postgres }} with logical replication
        run: |
          container="wallaby-profile-pg-${{ matrix.postgres }}"
          docker run --detach --name "${container}" \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            --publish 127.0.0.1::5432 \
            "postgres:${{ matrix.postgres }}-alpine" \
            -c wal_level=logical
          port=$(docker port "${container}" 5432/tcp | awk -F: '{print $NF}')
          test -n "${port}"
          for attempt in $(seq 1 60); do
            if docker exec "${container}" \
              pg_isready -U postgres -d postgres >/dev/null 2>&1
            then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker logs "${container}" >&2
              exit 1
            fi
            sleep 1
          done
          test_pg_dsn=$(
            printf '%s:%s@127.0.0.1:%s/%s?sslmode=disable' \
              'postgres://postgres' 'postgres' "${port}" 'postgres'
          )
          printf 'TEST_PG_DSN=%s\n' "${test_pg_dsn}" >> "${GITHUB_ENV}"

      - name: Repeated exact managed PostgreSQL profile admission and evidence
        run: |
          for iteration in 1 2; do
            echo "managed PostgreSQL profile iteration ${iteration}/2"
            just test-checkpoint2-postgres-profile
          done

      - name: Stop managed profile PostgreSQL
        if: always()
        run: |
          docker rm --force \
            "wallaby-profile-pg-${{ matrix.postgres }}" || true

  snowflake-managed-profile:
    name: snowflake-managed-profile-unpromoted
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.WALLABY_RUN_SNOWFLAKE_MANAGED == '1'
    runs-on: ubuntu-latest
    environment: snowflake-managed-profile
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Start PostgreSQL 16 authority
        run: |
          docker run --detach --name wallaby-snowflake-profile-postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            --publish 127.0.0.1::5432 \
            postgres:16-alpine -c wal_level=logical
          port=$(
            docker port wallaby-snowflake-profile-postgres 5432/tcp |
              awk -F: '{print $NF}'
          )
          for attempt in $(seq 1 60); do
            if docker exec wallaby-snowflake-profile-postgres \
              pg_isready -U postgres -d postgres >/dev/null 2>&1
            then
              break
            fi
            test "${attempt}" -ne 60
            sleep 1
          done
          printf '%s:%s@127.0.0.1:%s/%s?sslmode=disable\n' \
            'TEST_PG_DSN=postgres://postgres' 'postgres' "${port}" 'postgres' \
            >> "${GITHUB_ENV}"

      - name: Opt-in real Snowflake recovery evidence
        env:
          WALLABY_TEST_SNOWFLAKE_MANAGED: "1"
          WALLABY_TEST_SNOWFLAKE_DSN: >-
            ${{ secrets.WALLABY_TEST_SNOWFLAKE_DSN }}
          WALLABY_TEST_SNOWFLAKE_PROVISION_DSN: >-
            ${{ secrets.WALLABY_TEST_SNOWFLAKE_PROVISION_DSN }}
          WALLABY_TEST_SNOWFLAKE_VERSION: >-
            ${{ vars.WALLABY_TEST_SNOWFLAKE_VERSION }}
          WALLABY_TEST_SNOWFLAKE_REGION: >-
            ${{ vars.WALLABY_TEST_SNOWFLAKE_REGION }}
          WALLABY_TEST_SNOWFLAKE_OWNER_ROLE: >-
            ${{ vars.WALLABY_TEST_SNOWFLAKE_OWNER_ROLE }}
        run: just test-snowflake-managed-profile

      - name: Stop Snowflake profile PostgreSQL
        if: always()
        run: docker rm --force wallaby-snowflake-profile-postgres || true
