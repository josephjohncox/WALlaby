name: CI Spec

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  spec:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Setup Go
        id: setup-go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Setup Java
        # actions/setup-java v6.0.0
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Spec manifest
        run: just spec-verify

      - name: Generate protobufs
        run: just proto

      - name: Spec analyzer
        run: just spec-lint

      - name: Spec sync
        run: just spec-sync

      - name: TLA+ model check
        run: |
          just tla-tools
          just tla

      - name: TLA+ coverage
        run: |
          set -euo pipefail
          just tla-coverage
          if ! just tla-coverage-check; then
            echo "==== TLA coverage outputs ===="
            for f in specs/coverage/*.txt; do
              echo "---- ${f} ----"
              cat "${f}" || true
            done
            exit 1
          fi

      - name: Trace suite coverage
        run: |
          TRACE_CASES=200 TRACE_COVERAGE_REPORT=1 just trace-suite

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache v4.3.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}
