name: CI Spec

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  spec:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise


      - name: Restore Go + tools cache
        id: cache-go-tools
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: >-
            ${{ runner.os }}-go-${{ hashFiles('mise.toml') }}-tools-
            ${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: cache-go-build
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: >-
            ${{ runner.os }}-go-${{ hashFiles('mise.toml') }}-build-
            ${{ hashFiles('go.sum') }}

      - name: Save Go + tools cache
        if: always() && steps.cache-go-tools.outputs.cache-hit != 'true'
        # actions/cache/save v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/bin
            .cache/gomod
            .cache/golangci-lint
          key: ${{ steps.cache-go-tools.outputs.cache-primary-key }}

      - name: Spec manifest
        run: mise run spec-verify

      - name: Generate protobufs
        run: mise run proto

      - name: Spec analyzer
        run: mise run spec-lint

      - name: Spec sync
        run: mise run spec-sync

      - name: TLA+ model check
        run: |
          mise run tla-tools
          mise run tla

      - name: TLA+ coverage
        run: |
          set -euo pipefail
          mise run tla-coverage
          if ! mise run tla-coverage-check; then
            echo "==== TLA coverage outputs ===="
            for f in specs/coverage/*.txt; do
              echo "---- ${f} ----"
              cat "${f}" || true
            done
            exit 1
          fi

      - name: Trace suite coverage
        run: |
          TRACE_CASES=200 TRACE_COVERAGE_REPORT=1 mise run trace-suite

      - name: Save Go build cache
        if: always() && steps.cache-go-build.outputs.cache-hit != 'true'
        # actions/cache/save v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/gocache
          key: ${{ steps.cache-go-build.outputs.cache-primary-key }}
