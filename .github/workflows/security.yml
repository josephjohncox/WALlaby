name: Supply chain security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes for known vulnerabilities
        # actions/dependency-review-action v5.0.1
        uses: >-
          actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false

  root-dependency-submission:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Submit root Go and uv dependencies
        # Component Detection dependency submission action v0.2.1
        uses: >-
          advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52
        with:
          filePath: .
          fail-on-empty: true
          detectorArgs: UvLock=EnableIfDefaultOff
          directoryExclusionList: .git,.cache,.zed,**/.lake
          correlator: wallaby-root-go-and-uv
      # The action deletes its private temporary manifest. Reuse its acquired
      # executable to retain and verify the expected project graphs.
      - name: Verify root Go and uv dependency coverage
        run: mise run dependency-manifest-root
      - name: Retain detector manifest for coverage verification
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: root-dependency-detector-manifest
          path: .cache/security/dependencies-root.json
          if-no-files-found: error

  provider-dependency-submission:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Submit nested provider dependencies explicitly
        # Component Detection dependency submission action v0.2.1
        uses: >-
          advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52
        with:
          filePath: terraform/provider
          fail-on-empty: true
          correlator: wallaby-terraform-provider
      - name: Verify provider dependency coverage
        run: mise run dependency-manifest-provider
      - name: Retain provider detector manifest
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-dependency-detector-manifest
          path: .cache/security/dependencies-provider.json
          if-no-files-found: error
