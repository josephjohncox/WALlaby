name: CI Generation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise


      - name: Verify generated protobuf and Go artifacts
        run: mise run generate-check

      - name: Verify generated documentation
        run: mise run docs-verify

      - name: Test release tag validation
        run: ./scripts/validate-release-tag-selftest.sh

      - name: Test root module with generated protobufs
        run: go test ./...
