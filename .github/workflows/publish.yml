name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Validate release tag and commit
        run: |
          ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Setup Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Setup uv
        # astral-sh/setup-uv v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Setup Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Verify generated artifacts
        run: |
          just generate-check
          just docs-verify
          git diff --exit-code HEAD -- gen/go docs/reference/generated

      - name: Test root Go module
        run: go test ./...

      - name: Test and verify nested Terraform provider module
        working-directory: terraform/provider
        run: |
          go test ./...
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum

      - name: Run Rapid property tests
        run: RAPID_CHECKS=100 just test-rapid

      - name: Run full Helm chart checks
        run: ./scripts/helm-check.sh

  publish:
    needs: release-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set immutable release coordinates
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPOSITORY=$(
            printf '%s' "${GITHUB_REPOSITORY}" |
              tr '[:upper:]' '[:lower:]'
          )
          {
            echo "version=${VERSION}"
            echo "image=ghcr.io/${REPOSITORY}"
            echo "chart=oci://ghcr.io/${REPOSITORY}/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # docker/setup-qemu-action v3.6.0
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.11.1
        uses: >-
          docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Login to GHCR
        # docker/login-action v3.4.0
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Build and push image
        id: image
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Generate SBOM (Syft)
        # anchore/sbom-action v0.20.10
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d
        with:
          image: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        # sigstore/cosign-installer v3.10.0
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62

      - name: Sign immutable image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Package Helm chart
        run: |
          helm package charts/wallaby \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"

      - name: Push Helm chart (OCI)
        env:
          HELM_EXPERIMENTAL_OCI: "1"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_FILE: wallaby-${{ steps.vars.outputs.version }}.tgz
          CHART_REPOSITORY: ${{ steps.vars.outputs.chart }}
        run: |
          helm registry login ghcr.io \
            --username "${GHCR_USER}" \
            --password "${GHCR_TOKEN}"
          helm push "${CHART_FILE}" "${CHART_REPOSITORY}"
