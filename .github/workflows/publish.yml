name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Validate release tag and commit
        run: |
          ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Setup Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        # bufbuild/buf-setup-action v1.50.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.63.0"
          github_token: ${{ github.token }}

      - name: Setup uv
        # astral-sh/setup-uv v10.0.0
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.11.29"
          enable-cache: true
          prune-cache: true

      - name: Setup Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Verify generated artifacts
        run: |
          just generate-check
          just docs-verify
          git diff --exit-code HEAD -- gen/go docs/reference/generated

      - name: Test root Go module
        run: go test ./...

      - name: Test and verify nested Terraform provider module
        working-directory: terraform/provider
        run: |
          go test ./...
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum

      - name: Run Rapid property tests
        run: RAPID_CHECKS=100 just test-rapid

      - name: Run full Helm chart checks
        run: ./scripts/helm-check.sh

  publish:
    needs: release-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set immutable release coordinates
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPOSITORY=$(
            printf '%s' "${GITHUB_REPOSITORY}" |
              tr '[:upper:]' '[:lower:]'
          )
          {
            echo "version=${VERSION}"
            echo "image=ghcr.io/${REPOSITORY}"
            echo "chart=oci://ghcr.io/${REPOSITORY}/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # docker/setup-qemu-action v3.6.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.2.0
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to GHCR
        # docker/login-action v3.4.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        # azure/setup-helm v4.3.1
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Build and push image
        id: image
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Generate SBOM (Syft)
        # anchore/sbom-action v0.24.0
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        # sigstore/cosign-installer v3.10.0
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign immutable image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Package Helm chart
        run: |
          helm package charts/wallaby \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"

      - name: Push Helm chart (OCI)
        env:
          HELM_EXPERIMENTAL_OCI: "1"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_FILE: wallaby-${{ steps.vars.outputs.version }}.tgz
          CHART_REPOSITORY: ${{ steps.vars.outputs.chart }}
        run: |
          helm registry login ghcr.io \
            --username "${GHCR_USER}" \
            --password "${GHCR_TOKEN}"
          helm push "${CHART_FILE}" "${CHART_REPOSITORY}"
