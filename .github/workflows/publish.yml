name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOBIN: ${{ github.workspace }}/.cache/bin
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOCACHE: ${{ github.workspace }}/.cache/gocache
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Validate release tag and commit
        run: |
          ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main


      - name: Verify generated artifacts
        run: |
          mise run generate-check
          mise run docs-verify
          git diff --exit-code HEAD -- gen/go docs/reference/generated

      - name: Test root Go module
        run: go test ./...

      - name: Test and verify nested Terraform provider module
        working-directory: terraform/provider
        run: |
          go test ./...
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum

      - name: Run Rapid property tests
        run: RAPID_CHECKS=100 mise run test-rapid

      - name: Run full Helm chart checks
        run: ./scripts/helm-check.sh

  publish:
    needs: release-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set immutable release coordinates
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPOSITORY=$(
            printf '%s' "${GITHUB_REPOSITORY}" |
              tr '[:upper:]' '[:lower:]'
          )
          {
            echo "version=${VERSION}"
            echo "image=ghcr.io/${REPOSITORY}"
            echo "chart=oci://ghcr.io/${REPOSITORY}/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # docker/setup-qemu-action v4.4.0
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: >-
          docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GHCR
        # docker/login-action v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Build and push image
        id: image
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Generate SBOM (Syft)
        # anchore/sbom-action v0.24.3
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56
        with:
          image: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        # sigstore/cosign-installer v4.1.3
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab

      - name: Sign immutable image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: >-
            ${{ steps.vars.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Package Helm chart
        run: |
          helm package charts/wallaby \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"

      - name: Push Helm chart (OCI)
        env:
          HELM_EXPERIMENTAL_OCI: "1"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_FILE: wallaby-${{ steps.vars.outputs.version }}.tgz
          CHART_REPOSITORY: ${{ steps.vars.outputs.chart }}
        run: |
          helm registry login ghcr.io \
            --username "${GHCR_USER}" \
            --password "${GHCR_TOKEN}"
          helm push "${CHART_FILE}" "${CHART_REPOSITORY}"
