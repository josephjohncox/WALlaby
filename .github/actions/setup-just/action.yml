name: Setup just
description: Install the repository-pinned just command runner

inputs:
  version:
    description: just version
    required: false
    default: "1.56.0"

runs:
  using: composite
  steps:
    - name: Install just
      # extractions/setup-just v3
      uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      with:
        just-version: ${{ inputs.version }}
