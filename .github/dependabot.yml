version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /terraform/provider
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-patches-and-minors:
        patterns: ["*"]
        # Keep contract-constrained bumps visible as individual PRs rather
        # than blocking unrelated fixes. This does not suppress security PRs.
        # See docs/development/dependencies.md.
        exclude-patterns:
          - k8s.io/kube-openapi
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  # uv owns both pyproject.toml and uv.lock, including transitive docs packages.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      docs:
        patterns: ["*"]

  # Retain full commit SHAs and update the adjacent release comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /tests/integrationharness/fixtures/minio
    schedule:
      interval: weekly

  # Broker/profile versions are contracts: review SDK/server compatibility and
  # live evidence before accepting a Compose update, especially Iggy's protocol.
  - package-ecosystem: docker-compose
    directories:
      - /bench
      - /examples/quickstart
      - /examples/iggy
    schedule:
      interval: weekly
