replicaCount: 1

image:
  repository: ghcr.io/josephjohncox/wallaby
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Workers do not need Kubernetes API credentials by default. The dispatcher
# service account above alone receives Job-management RBAC.
workerServiceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# Production-safe defaults: the control plane requires a durable workflow
# store. Set workflowStore=memory only with environment=dev/test.
environment: production
workflowStore: postgres

kubernetesDispatch:
  enabled: false

snowflake:
  enabled: false
  account: ""
  user: ""
  host: ""
  privateKeyFile: /run/secrets/wallaby/snowflake-key.pem
  privateKeySecretName: ""
  privateKeySecretKey: private-key.pem
  streamingREST:
    enabled: false
    policyConfigMapName: ""
    policyConfigMapKey: enabled

podAnnotations: {}

podLabels: {}

service:
  type: ClusterIP
  port: 8080

serviceAnnotations: {}

probes:
  startup:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

tests:
  grpcHealthProbeImage:
    repository: ghcr.io/grpc-ecosystem/grpc-health-probe
    digest: >-
      sha256:a732f1b3a737926c2902393809b344c9f293b62f7069dbd0614caebd298b2e8d

# env:
#   - name: WALLABY_POSTGRES_DSN
#     value: "postgres://user:pass@postgres:5432/wallaby?sslmode=disable"
#   - name: WALLABY_GRPC_LISTEN
#     value: ":8080"
#   - name: WALLABY_WIRE_FORMAT
#     value: "arrow"
# Snowflake-backed execution is default-deny. Configure the typed snowflake
# block above; the chart mounts its Secret key into server and dispatched jobs.
env: []

# envFrom:
#   - secretRef:
#       name: wallaby-secrets
#   - configMapRef:
#       name: wallaby-config
envFrom: []

config:
  enabled: false
  # data:
  #   WALLABY_GRPC_LISTEN: ":8080"
  #   WALLABY_WIRE_FORMAT: "arrow"
  data: {}

# command:
#   - /usr/local/bin/wallaby
command: []

# args:
#   - --config=/etc/wallaby/config.yaml
args: []

# resources:
#   requests:
#     cpu: 200m
#     memory: 256Mi
#   limits:
#     cpu: 1000m
#     memory: 1Gi
resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# https://opentelemetry.io/docs/concepts/sdk-configuration/otlp-exporter-configuration/
observability:
  metrics:
    enabled: false
    otel:
      endpoint: ""
      insecure: true
      protocol: "grpc"
      interval: "30s"
      # serviceName: ""  # optional, defaults to release fullname
  traces:
    enabled: false
    otel:
      endpoint: ""
      insecure: true
      protocol: "grpc"
      # serviceName: ""  # optional, defaults to release fullname
  profiling:
    enabled: false
    port: 6060

workers:
  enabled: false
