apiVersion: v1
kind: Pod
metadata:
  name: '{{ include "wallaby.fullname" . }}-test'
  labels:
    app.kubernetes.io/name: '{{ include "wallaby.name" . }}'
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: grpc-check
      image: '{{ include "wallaby.grpcHealthProbeImage" . }}'
      command: ["/ko-app/grpc-health-probe"]
      args:
        - -addr={{ include "wallaby.fullname" . }}:{{ .Values.service.port }}
        - -service=wallaby.readiness
        - -rpc-timeout=5s
