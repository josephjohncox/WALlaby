      automountServiceAccountToken: {{ $root.Values.workerServiceAccount.automountServiceAccountToken }}
{{- if $root.Values.snowflake.enabled }}
      volumes:
        - name: snowflake-private-key
          secret:
            secretName: {{ required "snowflake.privateKeySecretName is required" $root.Values.snowflake.privateKeySecretName | quote }}
            defaultMode: 288
            items:
              - key: {{ required "snowflake.privateKeySecretKey is required" $root.Values.snowflake.privateKeySecretKey | quote }}
                path: private-key.pem
                mode: 288
{{- end }}
      containers:
        - name: wallaby-worker
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          imagePullPolicy: {{ $imagePullPolicy }}
{{- if $root.Values.snowflake.enabled }}
          volumeMounts:
            - name: snowflake-private-key
              mountPath: {{ $root.Values.snowflake.privateKeyFile | quote }}
              subPath: private-key.pem
              readOnly: true
{{- end }}
{{- if $worker.command }}
          command: {{ toYaml $worker.command | nindent 12 }}
{{- end }}
{{- if $worker.args }}
          args: {{ toYaml $worker.args | nindent 12 }}
{{- end }}
{{- $envFrom := list }}
{{- if $root.Values.config.enabled }}
{{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" (include "wallaby.fullname" $root))) }}
{{- end }}
{{- range $worker.envFrom }}
{{- $envFrom = append $envFrom . }}
{{- end }}
{{- if $envFrom }}
          envFrom:
{{ toYaml $envFrom | indent 12 }}
{{- end }}
{{- $otelEnv := include "wallaby.otelEnv" $root }}
          env:
{{- with $worker.env }}
{{ toYaml . | indent 12 }}
{{- end }}
{{ $otelEnv | indent 12 }}
{{ include "wallaby.snowflakeWorkerEnv" $root | indent 12 }}
{{- with $worker.resources }}
          resources:
{{ toYaml . | indent 12 }}
{{- end }}
{{- with $worker.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with $worker.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with $worker.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: {{ include "wallaby.name" $root }}
    helm.sh/chart: {{ $root.Chart.Name }}-{{ $root.Chart.Version }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker: {{ $name }}
spec:
  replicas: {{ default 1 $worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wallaby.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/worker: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wallaby.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/worker: {{ $name }}
{{- with $worker.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
      annotations:
        checksum/snowflake-streaming-policy: {{ include (print $root.Template.BasePath "/snowflake-policy-configmap.yaml") $root | sha256sum }}
{{- with $worker.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
{{- if $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml $root.Values.imagePullSecrets | indent 8 }}
{{- end }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
