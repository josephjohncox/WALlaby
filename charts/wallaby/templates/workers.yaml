{{- if and .Values.workers.enabled (gt (len .Values.workers.items) 0) -}}
{{- $root := . -}}
{{- range $index, $worker := .Values.workers.items }}
{{- $name := default (printf "worker-%d" $index) $worker.name -}}
{{- $fullName := printf "%s-worker-%s" (include "wallaby.fullname" $root) $name | trunc 63 | trimSuffix "-" -}}
{{- $kind := default "deployment" $worker.kind | lower -}}
{{- $imageRepo := dig "image" "repository" $root.Values.image.repository $worker -}}
{{- $imageTag := dig "image" "tag" $root.Values.image.tag $worker -}}
{{- $imagePullPolicy := dig "image" "pullPolicy" $root.Values.image.pullPolicy $worker -}}
{{- range $entry := $worker.env }}
{{- if has $entry.name (list "WALLABY_WORKER_SNOWFLAKE_ENABLED" "WALLABY_WORKER_SNOWFLAKE_ACCOUNT" "WALLABY_WORKER_SNOWFLAKE_USER" "WALLABY_WORKER_SNOWFLAKE_HOST" "WALLABY_WORKER_SNOWFLAKE_PRIVATE_KEY_FILE" "WALLABY_WORKER_SNOWFLAKE_STREAMING_REST_ENABLED" "WALLABY_SNOWFLAKE_ENABLED" "WALLABY_SNOWFLAKE_ACCOUNT" "WALLABY_SNOWFLAKE_USER" "WALLABY_SNOWFLAKE_HOST" "WALLABY_SNOWFLAKE_PRIVATE_KEY_FILE" "WALLABY_SNOWFLAKE_STREAMING_REST_ENABLED") -}}
{{- fail "workers.items[].env cannot override the Snowflake deployment policy" -}}
{{- end -}}
{{- end -}}
{{- if eq $kind "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: {{ include "wallaby.name" $root }}
    helm.sh/chart: {{ $root.Chart.Name }}-{{ $root.Chart.Version }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker: {{ $name }}
spec:
  schedule: {{ required "workers.items[].schedule is required for cronjob" $worker.schedule | quote }}
  concurrencyPolicy: {{ default "Forbid" $worker.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ default 3 $worker.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default 1 $worker.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ default 1 $worker.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "wallaby.name" $root }}
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/component: worker
            app.kubernetes.io/worker: {{ $name }}
{{- with $worker.podLabels }}
{{ toYaml . | nindent 12 }}
{{- end }}
          annotations:
            checksum/snowflake-streaming-policy: {{ include (print $root.Template.BasePath "/snowflake-policy-configmap.yaml") $root | sha256sum }}
{{- with $worker.podAnnotations }}
{{ toYaml . | nindent 12 }}
{{- end }}
        spec:
          restartPolicy: {{ default "Never" $worker.restartPolicy }}
{{- if $root.Values.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml $root.Values.imagePullSecrets | indent 12 }}
{{- end }}
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
          serviceAccountName: {{ include "wallaby.workerServiceAccountName" $root }}
          automountServiceAccountToken: {{ $root.Values.workerServiceAccount.automountServiceAccountToken }}
{{- if $root.Values.snowflake.enabled }}
          volumes:
            - name: snowflake-private-key
              secret:
                secretName: {{ required "snowflake.privateKeySecretName is required" $root.Values.snowflake.privateKeySecretName | quote }}
                defaultMode: 288
                items:
                  - key: {{ required "snowflake.privateKeySecretKey is required" $root.Values.snowflake.privateKeySecretKey | quote }}
                    path: private-key.pem
                    mode: 288
{{- end }}
          containers:
            - name: wallaby-worker
              image: "{{ $imageRepo }}:{{ $imageTag }}"
              imagePullPolicy: {{ $imagePullPolicy }}
{{- if $root.Values.snowflake.enabled }}
              volumeMounts:
                - name: snowflake-private-key
                  mountPath: {{ $root.Values.snowflake.privateKeyFile | quote }}
                  subPath: private-key.pem
                  readOnly: true
{{- end }}
{{- if $worker.command }}
              command: {{ toYaml $worker.command | nindent 16 }}
{{- end }}
{{- if $worker.args }}
              args: {{ toYaml $worker.args | nindent 16 }}
{{- end }}
{{- $envFrom := list }}
{{- if $root.Values.config.enabled }}
{{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" (include "wallaby.fullname" $root))) }}
{{- end }}
{{- range $worker.envFrom }}
{{- $envFrom = append $envFrom . }}
{{- end }}
{{- if $envFrom }}
              envFrom:
{{ toYaml $envFrom | indent 16 }}
{{- end }}
{{- $otelEnv := include "wallaby.otelEnv" $root }}
              env:
{{- with $worker.env }}
{{ toYaml . | indent 16 }}
{{- end }}
{{ $otelEnv | indent 16 }}
{{ include "wallaby.snowflakeWorkerEnv" $root | indent 16 }}
{{- with $worker.resources }}
              resources:
{{ toYaml . | indent 16 }}
{{- end }}
{{- with $worker.nodeSelector }}
          nodeSelector:
{{ toYaml . | indent 12 }}
{{- end }}
{{- with $worker.affinity }}
          affinity:
{{ toYaml . | indent 12 }}
{{- end }}
{{- with $worker.tolerations }}
          tolerations:
{{ toYaml . | indent 12 }}
{{- end }}
{{- else if eq $kind "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: {{ include "wallaby.name" $root }}
