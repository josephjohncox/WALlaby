      restartPolicy: {{ default "Never" $worker.restartPolicy }}
{{- if $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml $root.Values.imagePullSecrets | indent 8 }}
{{- end }}
      securityContext:
        fsGroup: 65532
