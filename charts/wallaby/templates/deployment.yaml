apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wallaby.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "wallaby.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wallaby.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wallaby.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
      annotations:
        checksum/snowflake-streaming-policy: {{ include (print $.Template.BasePath "/snowflake-policy-configmap.yaml") . | sha256sum }}
{{- with .Values.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: {{ include "wallaby.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.kubernetesDispatch.enabled }}
      containers:
        - name: wallaby
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- if .Values.command }}
          command: {{ toYaml .Values.command | nindent 12 }}
{{- end }}
{{- if .Values.args }}
          args: {{ toYaml .Values.args | nindent 12 }}
{{- end }}
{{- if .Values.snowflake.enabled }}
          volumeMounts:
            - name: snowflake-private-key
              mountPath: {{ .Values.snowflake.privateKeyFile | quote }}
              subPath: private-key.pem
              readOnly: true
{{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
{{- if .Values.observability.profiling.enabled }}
            - name: pprof
              containerPort: {{ .Values.observability.profiling.port }}
              protocol: TCP
{{- end }}
{{- if .Values.probes.startup.enabled }}
          startupProbe:
            grpc:
              port: {{ .Values.service.port }}
              service: wallaby.startup
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
{{- end }}
{{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
              service: wallaby.readiness
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
{{- end }}
{{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
              service: wallaby.liveness
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
{{- end }}
{{- $envFrom := list }}
{{- $jobEnvFrom := list }}
{{- if .Values.config.enabled }}
{{- $configMapName := include "wallaby.fullname" . }}
{{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" $configMapName)) }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "configmap:%s" $configMapName) }}
{{- end }}
{{- range .Values.envFrom }}
{{- $envFrom = append $envFrom . }}
{{- if .secretRef }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "secret:%s" .secretRef.name) }}
{{- else if .configMapRef }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "configmap:%s" .configMapRef.name) }}
{{- end }}
{{- end }}
{{- if $envFrom }}
          envFrom:
{{ toYaml $envFrom | indent 12 }}
{{- end }}
{{- $otelEnv := include "wallaby.otelEnv" . }}
          env:
            - name: WALLABY_ENV
              value: {{ .Values.environment | quote }}
            - name: WALLABY_WORKFLOW_STORE
              value: {{ .Values.workflowStore | quote }}
            - name: WALLABY_SNOWFLAKE_ENABLED
              value: {{ .Values.snowflake.enabled | quote }}
            - name: WALLABY_SNOWFLAKE_STREAMING_REST_ENABLED
              value: {{ .Values.snowflake.streamingRest.enabled | quote }}
            - name: WALLABY_SNOWFLAKE_STREAMING_REST_POLICY_CONFIG_MAP_NAME
              value: {{ default (printf "%s-snowflake-policy" (include "wallaby.fullname" .)) .Values.snowflake.streamingRest.policyConfigMapName | quote }}
            - name: WALLABY_SNOWFLAKE_STREAMING_REST_POLICY_CONFIG_MAP_KEY
              value: {{ .Values.snowflake.streamingRest.policyConfigMapKey | quote }}
            - name: WALLABY_SNOWFLAKE_ACCOUNT
              value: {{ .Values.snowflake.account | quote }}
            - name: WALLABY_SNOWFLAKE_USER
              value: {{ .Values.snowflake.user | quote }}
            - name: WALLABY_SNOWFLAKE_HOST
              value: {{ .Values.snowflake.host | quote }}
            - name: WALLABY_SNOWFLAKE_PRIVATE_KEY_FILE
              value: {{ .Values.snowflake.privateKeyFile | quote }}
            - name: WALLABY_SNOWFLAKE_PRIVATE_KEY_SECRET_NAME
              value: {{ .Values.snowflake.privateKeySecretName | quote }}
            - name: WALLABY_SNOWFLAKE_PRIVATE_KEY_SECRET_KEY
              value: {{ .Values.snowflake.privateKeySecretKey | quote }}
{{- if .Values.kubernetesDispatch.enabled }}
            - name: WALLABY_K8S_ENABLED
              value: "true"
            - name: WALLABY_K8S_JOB_IMAGE
              value: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
            - name: WALLABY_K8S_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: WALLABY_K8S_JOB_SERVICE_ACCOUNT
              value: {{ include "wallaby.workerServiceAccountName" . | quote }}
            - name: WALLABY_K8S_JOB_AUTOMOUNT_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.workerServiceAccount.automountServiceAccountToken | quote }}
{{- if $jobEnvFrom }}
            - name: WALLABY_K8S_JOB_ENV_FROM
              value: {{ join "," $jobEnvFrom | quote }}
{{- end }}
{{- end }}
{{- with .Values.env }}
{{ toYaml . | indent 12 }}
{{- end }}
{{ $otelEnv | indent 12 }}
{{- with .Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
{{- end }}
{{- if .Values.snowflake.enabled }}
      volumes:
        - name: snowflake-private-key
          secret:
            secretName: {{ required "snowflake.privateKeySecretName is required when snowflake.enabled=true" .Values.snowflake.privateKeySecretName | quote }}
            defaultMode: 288
            items:
              - key: {{ required "snowflake.privateKeySecretKey is required when snowflake.enabled=true" .Values.snowflake.privateKeySecretKey | quote }}
                path: private-key.pem
                mode: 288
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
