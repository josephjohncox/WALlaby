apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wallaby.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "wallaby.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wallaby.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wallaby.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      serviceAccountName: {{ include "wallaby.serviceAccountName" . }}
      containers:
        - name: wallaby
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- if .Values.command }}
          command: {{ toYaml .Values.command | nindent 12 }}
{{- end }}
{{- if .Values.args }}
          args: {{ toYaml .Values.args | nindent 12 }}
{{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
{{- if .Values.observability.profiling.enabled }}
            - name: pprof
              containerPort: {{ .Values.observability.profiling.port }}
              protocol: TCP
{{- end }}
{{- $envFrom := list }}
{{- $jobEnvFrom := list }}
{{- if .Values.config.enabled }}
{{- $configMapName := include "wallaby.fullname" . }}
{{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" $configMapName)) }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "configmap:%s" $configMapName) }}
{{- end }}
{{- range .Values.envFrom }}
{{- $envFrom = append $envFrom . }}
{{- if .secretRef }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "secret:%s" .secretRef.name) }}
{{- else if .configMapRef }}
{{- $jobEnvFrom = append $jobEnvFrom (printf "configmap:%s" .configMapRef.name) }}
{{- end }}
{{- end }}
{{- if $envFrom }}
          envFrom:
{{ toYaml $envFrom | indent 12 }}
{{- end }}
{{- $otelEnv := include "wallaby.otelEnv" . }}
          env:
            - name: WALLABY_ENV
              value: {{ .Values.environment | quote }}
            - name: WALLABY_WORKFLOW_STORE
              value: {{ .Values.workflowStore | quote }}
{{- if .Values.kubernetesDispatch.enabled }}
            - name: WALLABY_K8S_ENABLED
              value: "true"
            - name: WALLABY_K8S_JOB_IMAGE
              value: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
            - name: WALLABY_K8S_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: WALLABY_K8S_JOB_SERVICE_ACCOUNT
              value: {{ include "wallaby.workerServiceAccountName" . | quote }}
            - name: WALLABY_K8S_JOB_AUTOMOUNT_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.workerServiceAccount.automountServiceAccountToken | quote }}
{{- if $jobEnvFrom }}
            - name: WALLABY_K8S_JOB_ENV_FROM
              value: {{ join "," $jobEnvFrom | quote }}
{{- end }}
{{- end }}
{{- with .Values.env }}
{{ toYaml . | indent 12 }}
{{- end }}
{{ $otelEnv | indent 12 }}
{{- with .Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
