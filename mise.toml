[tasks."test-snowflake-staged-authority-commercial"]
description = "Credential-gated same-SHA staged authority evidence. This recipe is not part of ordinary branch promotion and fails closed when credentials are absent."
shell = "bash -euo pipefail -c"
run = '''
test "${WALLABY_TEST_SNOWFLAKE_MANAGED:-}" = "1" || { echo 'WALLABY_TEST_SNOWFLAKE_MANAGED=1 is required' >&2; exit 2; }
test "${WALLABY_TEST_SNOWFLAKE_STAGED_AUTO_INGEST:-}" = "1" || { echo 'WALLABY_TEST_SNOWFLAKE_STAGED_AUTO_INGEST=1 is required' >&2; exit 2; }
required='TestSnowflakeStagedManagedProfileReviewedDeploymentCell,TestSnowflakeStagedManagedProfileLiveAdmission,TestSnowflakeStagedManagedProfileFailClosedCopy,TestSnowflakeStagedManagedProfileStageIdentityCollision,TestSnowflakeStagedManagedProfilePutUncertainty,TestSnowflakeStagedManagedProfileAutoIngestCompletion,TestSnowflakeStagedManagedProfileCopyTransportLossAndDetachedTakeover,TestSnowflakeStagedManagedProfileRoleIsolation,TestSnowflakeStagedManagedProfilePipeIsolation,TestSnowflakeStagedManagedProfileNetworkFaultMatrix,TestSnowflakeStagedManagedProfileProcessKillRecovery,TestSnowflakeStagedManagedProfileWorkerSIGKILLRecovery,TestSnowflakeStagedManagedProfileCleanup'
IT_REQUIRED_TESTS="${required}" IT_RUN_FILTER="^($(printf '%s' "${required}" | tr ',' '|'))$" INTEGRATION_PACKAGE='./tests' mise run test-integration
'''

[tasks.setup]
description = "Prepare a fresh checkout with locked dependencies and code generators"
run = ["go mod download", "go -C terraform/provider mod download", "uv sync --frozen", "mise run proto-tools"]

[tasks.build]
description = "Build CLI binaries and the Terraform provider into bin/"
run = ["go build -trimpath -o bin/ ./cmd/...", "go -C terraform/provider build -trimpath -o ../../bin/terraform-provider-wallaby ."]

[tasks."deps:check"]
description = "Verify checksums and tidy manifests in every Go module and check the Python lock"
run = ["go mod verify", "go mod tidy -diff", "go -C terraform/provider mod verify", "go -C terraform/provider mod tidy -diff", "uv lock --check"]

[tasks."dependency-manifest-root"]
description = "Verify root Go and uv graphs from the public detector executable supplied by CI"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .cache/security
./component-detection scan --SourceDirectory . --ManifestFile .cache/security/dependencies-root.json --DirectoryExclusionList '.git,.cache,.zed,**/.lake' --DetectorArgs UvLock=EnableIfDefaultOff
python scripts/verify-dependency-manifest.py .cache/security/dependencies-root.json --require go.mod --require uv.lock
'''

[tasks."dependency-manifest-provider"]
description = "Verify the nested provider graph from the public detector executable supplied by CI"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .cache/security
./component-detection scan --SourceDirectory terraform/provider --ManifestFile .cache/security/dependencies-provider.json
python scripts/verify-dependency-manifest.py .cache/security/dependencies-provider.json --require terraform/provider/go.mod
'''

[tasks.security]
description = "Scan both Go applications and the locked Python documentation dependencies"
run = ["mise run vulncheck", "cd terraform/provider && {{ vars.go }} run golang.org/x/vuln/cmd/govulncheck@{{ vars.govulncheck_version }} ./...", "mise run security-python"]

[tasks."security-python"]
description = "Audit exactly the hashed documentation lock with pip-audit 2.10.1"
shell = "bash -euo pipefail -c"
run = '''
requirements=$(mktemp)
trap 'rm -f "$requirements"' EXIT
{{ vars.uv }} export --locked --no-emit-project --format requirements-txt --output-file "$requirements" >/dev/null
{{ vars.uv }} tool run --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes --requirement "$requirements"
'''


[tasks."ci-check-test"]
description = "Run non-mutating formatting, lint, complete unit, dependency and security gates"
run = ["mise run format:check", "mise run lint", "mise run proto-lint", "mise run test", "mise run test-protocol", "mise run test-proof-runner", "mise run deps:check", "mise run security"]

[tasks."test-protocol"]
description = "Production Runner exploration, real-store histories, and mutation-sensitive protocol gates"
run = [
  "go test -count=1 -v ./pkg/stream -run 'TestManagedProtocol|TestDDLIndeterminate|TestRunnerReconcilesCommitBeforeReceipt'",
  "go test -count=1 ./internal/reconcilepolicy -run 'TestDecide|TestRuntime'",
  "go test -count=1 ./internal/delivery -run '^TestReconciliation'",
  "go test -count=1 ./internal/checkpoint -run 'TestSQLiteCheckpointOutboxLinearizability|TestCheckpointHistoryModel'",
  "mise run spec-sync",
  "mise run spec-verify",
  "mise run test-protocol-mutations",
  "mise run test-tla-mutations",
]

[tasks."test-protocol-mutations"]
description = "Require ten production Go overlay mutants to fail specific protocol properties"
run = "go run ./tools/protocolmutate"

[tasks."test-tla-mutations"]
description = "Require DDL abstract-model safety mutants and nonzero indeterminate coverage"
run = ["mise run tla-tools", "python scripts/check-tla-mutants.py --jar '{{ vars.tla_tools_jar }}'"]

[tasks."pre-commit"]
description = "Fast non-mutating Go formatting and Protobuf checks"
run = ["mise run format:check", "mise run proto-lint"]

[tasks."test-postgres18-quickstart"]
description = "Require real PostgreSQL 18 quickstart E2E, exact authority catalog, and validated-NOT-NULL tamper evidence"
shell = "bash -euo pipefail -c"
run = '''
: "${TEST_PG_DSN:?provide a disposable PostgreSQL 18 database with logical replication}"
mkdir -p .cache/test-results
go test -count=1 -json ./internal/controlplane -run '^(TestExactAuthorityManifestMatchesFreshCatalog|TestDeliveryManifestAuthorityTamperPG18|TestUnvalidatedNotNullAuthorityRejectedPostgres18)$' > .cache/test-results/postgres18-catalog.json
go run ./scripts/verify-go-test-json.go -results .cache/test-results/postgres18-catalog.json -required 'TestExactAuthorityManifestMatchesFreshCatalog,TestDeliveryManifestAuthorityTamperPG18,TestUnvalidatedNotNullAuthorityRejectedPostgres18'
IT_KIND=0 IT_SERVICES=none IT_COMPOSE_IGGY=false IT_PACKAGE_PARALLELISM=1 IT_EXPECTED_HARNESS_PARTICIPANTS=1 INTEGRATION_PACKAGE=./tests/integration IT_RUN_FILTER='^TestPostgresToPostgresE2E$' IT_REQUIRED_TESTS=TestPostgresToPostgresE2E IT_RESULTS_FILE="$PWD/.cache/test-results/postgres18-e2e.json" mise run test-integration
'''

[tasks."test-proof-runner"]
description = "Unit-test proof runner tool admission, subprocess isolation and frozen contract without native verifier tools"
run = "python -m unittest discover -s verification/gobra -p 'test_*.py'"

[tasks."proof-gobra-bootstrap"]
description = "Fetch/build pinned Gobra pilot prerequisites (macOS arm64 only; fail closed elsewhere)"
run = "python verification/gobra/bootstrap.py"

[tasks."proof-gobra"]
description = "Prove actual reconciliation policy with Gobra plus rejected false-property/mutant controls"
run = "python verification/gobra/verify.py"

[tasks."proof-goose-bootstrap"]
description = "Install the pinned local Lean toolchain through existing public elan (no default change)"
shell = "bash -euo pipefail -c"
run = '''
command -v elan >/dev/null || { echo "Install public elan to provide lean/lake shims, then rerun this task" >&2; exit 1; }
IFS= read -r toolchain < verification/goose/lean-toolchain
elan toolchain install "$toolchain"
'''

[tasks."proof-goose-drift"]
description = "Regenerate production Goose translation and reject drift (NOT a proof)"
run = "sh verification/goose/scripts/regenerate.sh"

[tasks."proof-goose"]
description = "Check production-linked Perennial WP, standard axiom allowlist and rejected false-property control"
run = "sh verification/goose/scripts/check.sh"

[tasks."test-live-local"]
description = "Provision owned kind PostgreSQL + Compose Iggy through Go executors and require live delivery evidence"
shell = "bash -euo pipefail -c"
run = '''
run_id="wallaby-live-$$"
evidence="{{ vars.root }}/.cache/live-evidence/${run_id}"
mkdir -p "$evidence"
required='TestPostgresCommitBeforeReceiptReconciles,TestPostgresGenerationFenceRejectsStaleCommit,TestPostgresManagedTransactionCommitBeforeReceiptReconciles,TestPostgresToPostgresManagedRecoveryContract,TestPostgresCheckpointGenerationFenceRejectsStaleCommit,TestIggyDestinationWireFormats,TestPostgresToIggyCDCCheckpointRestart'
filter="^($(printf '%s' "$required" | tr ',' '|'))$"
IT_KIND=1 IT_KIND_CLUSTER="$run_id" IT_SERVICES=none IT_COMPOSE_IGGY=true \
  IT_EXPECTED_HARNESS_PARTICIPANTS=1 IT_PACKAGE_PARALLELISM=1 INTEGRATION_PACKAGE=./tests \
  IT_REQUIRED_TESTS="$required" IT_RUN_FILTER="$filter" IT_RESULTS_FILE="$evidence/go-test.json" \
  mise run test-integration
printf 'Live Go executor evidence: %s\n' "$evidence/go-test.json"
'''

[tasks."test-iggy"]
description = "Native Iggy 0.10 readback for all four wire formats, with no-skip accounting"
shell = "bash -euo pipefail -c"
run = '''
test -n "${WALLABY_TEST_IGGY_ADDRESS:-}" || { echo 'WALLABY_TEST_IGGY_ADDRESS is required' >&2; exit 2; }
test -n "${WALLABY_TEST_IGGY_USERNAME:-}" || { echo 'WALLABY_TEST_IGGY_USERNAME is required' >&2; exit 2; }
test -n "${WALLABY_TEST_IGGY_PASSWORD:-}" || { echo 'WALLABY_TEST_IGGY_PASSWORD is required' >&2; exit 2; }
results=$(mktemp)
trap 'rm -f "$results"' EXIT
if ! {{ vars.go }} test -count=1 -json ./tests -run '^TestIggyDestinationWireFormats$' >"$results"; then
  cat "$results"
  exit 1
fi
cat "$results"
{{ vars.go }} run ./scripts/verify-go-test-json.go -results "$results" -required TestIggyDestinationWireFormats
'''
