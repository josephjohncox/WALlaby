#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.0"

# Public, reproducible tools. No private CLI, registry or organization login.
# Keep Go aligned with both application go.mod files and Dockerfile.
[tools]
go = "1.27.4"
uv = "0.13.9"
python = "3.15.2"
buf = "1.75.0"
protoc = "36.2"
golangci-lint = "2.15.0"
goreleaser = "2.20.3"
helm = "4.3.2"
kind = "0.33.0"
java = "temurin-25.0.5+8.0.LTS"

[env]
GOTOOLCHAIN = "local"
# The Go driver does not need its optional self-extracting native minicore.
SF_DISABLE_MINICORE = "true"
# uv must not silently reuse an older interpreter from an existing .venv.
UV_PYTHON = "3.15.2"
UV_PYTHON_DOWNLOADS = "never"

# Environment overrides remain available for CI, integration and evidence runs.
[vars]
go = "{{ env.GO | default(value=\"go\") }}"
buf = "{{ env.BUF | default(value=\"buf\") }}"
golangci_lint = "{{ env.GOLANGCI_LINT | default(value=\"golangci-lint\") }}"
staticcheck_version = "{{ env.STATICCHECK_VERSION | default(value=\"v0.8.2\") }}"
govulncheck_version = "{{ env.GOVULNCHECK_VERSION | default(value=\"v1.10.0\") }}"
goreleaser = "{{ env.GORELEASER | default(value=\"goreleaser\") }}"
protoc_gen_go_version = "{{ env.PROTOC_GEN_GO_VERSION | default(value=\"v1.36.12\") }}"
protoc_gen_go_grpc_version = "{{ env.PROTOC_GEN_GO_GRPC_VERSION | default(value=\"v1.6.2\") }}"
gomarkdoc_version = "{{ env.GOMARKDOC_VERSION | default(value=\"v1.1.0\") }}"
protoc_gen_doc_version = "{{ env.PROTOC_GEN_DOC_VERSION | default(value=\"v1.5.1\") }}"
uv = "{{ env.UV | default(value=\"uv\") }}"
uv_version = "{{ env.UV_VERSION | default(value=\"0.13.9\") }}"
root = "{{config_root}}"
cache_dir = "{{ env.CACHE_DIR | default(value=\".cache\") }}"
gomodcache = "{{ env.GOMODCACHE | default(value=vars.root ~ \"/\" ~ vars.cache_dir ~ \"/gomod\") }}"
gocache = "{{ env.GOCACHE | default(value=vars.root ~ \"/\" ~ vars.cache_dir ~ \"/gocache\") }}"
golangci_lint_cache = "{{ env.GOLANGCI_LINT_CACHE | default(value=vars.root ~ \"/\" ~ vars.cache_dir ~ \"/golangci-lint\") }}"
gobin = "{{ env.GOBIN | default(value=config_root ~ '/.cache/bin') }}"
profile = "{{ env.PROFILE | default(value=\"small\") }}"
targets = "{{ env.TARGETS | default(value=\"all\") }}"
scenario = "{{ env.SCENARIO | default(value=\"base\") }}"
baseline = "{{ env.BASELINE | default(value=\"\") }}"
candidate = "{{ env.CANDIDATE | default(value=\"\") }}"
tlc = "{{ env.TLC | default(value=\"tlc2.TLC\") }}"
tla_module = "{{ env.TLA_MODULE | default(value=\"specs/CDCFlow.tla\") }}"
tla_config = "{{ env.TLA_CONFIG | default(value=\"specs/CDCFlow.cfg\") }}"
tla_tools_tag = "{{ env.TLA_TOOLS_TAG | default(value=\"v1.7.4\") }}"
tla_tools_url = "{{ env.TLA_TOOLS_URL | default(value=\"https://github.com/tlaplus/tlaplus/releases/download/\" ~ vars.tla_tools_tag ~ \"/tla2tools.jar\") }}"
tla_tools_dir = "{{ env.TLA_TOOLS_DIR | default(value=vars.root ~ \"/\" ~ vars.cache_dir ~ \"/tla\") }}"
tla_tools_jar = "{{ env.TLA_TOOLS_JAR | default(value=vars.tla_tools_dir ~ \"/tla2tools.jar\") }}"
tla_tools_sha256_file = "{{ env.TLA_TOOLS_SHA256_FILE | default(value=\"scripts/tla2tools-\" ~ vars.tla_tools_tag ~ \".sha256\") }}"
tlc_java_opts = "{{ env.TLC_JAVA_OPTS | default(value=\"-XX:+UseParallelGC\") }}"
tlc_args = "{{ env.TLC_ARGS | default(value=\"\") }}"
skip_tla_checks = "{{ env.SKIP_TLA_CHECKS | default(value=\"false\") }}"
tlc_coverage_dir = "{{ env.TLC_COVERAGE_DIR | default(value=\"specs/coverage\") }}"
tla_coverage_min = "{{ env.TLA_COVERAGE_MIN | default(value=\"1\") }}"
tla_coverage_ignore = "{{ env.TLA_COVERAGE_IGNORE | default(value=\"\") }}"
trace_cases = "{{ env.TRACE_CASES | default(value=\"1000\") }}"
trace_seed = "{{ env.TRACE_SEED | default(value=\"1\") }}"
trace_max_batches = "{{ env.TRACE_MAX_BATCHES | default(value=\"10\") }}"
trace_max_records = "{{ env.TRACE_MAX_RECORDS | default(value=\"3\") }}"
rapid_checks = "{{ env.RAPID_CHECKS | default(value=\"100\") }}"
failure_cycles = "{{ env.FAILURE_CYCLES | default(value=\"100\") }}"
failure_seed = "{{ env.FAILURE_SEED | default(value=\"20260728\") }}"
soak_duration = "{{ env.SOAK_DURATION | default(value=\"30s\") }}"
soak_seed = "{{ env.SOAK_SEED | default(value=\"20260728\") }}"
rapid_packages = "{{ env.RAPID_PACKAGES | default(value=\"./pkg/stream ./pkg/wire ./internal/artifactlog ./internal/ddl ./internal/registry ./internal/schema ./internal/workflow ./connectors/sources/postgres ./connectors/destinations/postgres\") }}"
spec_lint_verbose = "{{ env.SPEC_LINT_VERBOSE | default(value=\"\") }}"
spec_lint_verbose_mode = "{{ env.SPEC_LINT_VERBOSE_MODE | default(value=\"checks\") }}"
go_test_timeout = "{{ env.GO_TEST_TIMEOUT | default(value=\"\") }}"
go_test_verbose = "{{ env.GO_TEST_VERBOSE | default(value=\"1\") }}"
go_test_verbose_flag = "{{ env.GO_TEST_VERBOSE_FLAG | default(value=\"\") }}"
it_kind = "{{ env.IT_KIND | default(value=\"\") }}"
it_keep = "{{ env.IT_KEEP | default(value=\"0\") }}"
it_kind_cluster = "{{ env.IT_KIND_CLUSTER | default(value=\"\") }}"
it_kind_node_image = "{{ env.IT_KIND_NODE_IMAGE | default(value=\"\") }}"
it_service_ready_timeout_seconds = "{{ env.IT_SERVICE_READY_TIMEOUT_SECONDS | default(value=\"240\") }}"
it_run_filter = "{{ env.IT_RUN_FILTER | default(value=\"\") }}"
it_skip_filter = "{{ env.IT_SKIP_FILTER | default(value=\"\") }}"
it_count = "{{ env.IT_COUNT | default(value=\"\") }}"
it_package_parallelism = "{{ env.IT_PACKAGE_PARALLELISM | default(value=\"1\") }}"
it_expected_harness_participants = "{{ env.IT_EXPECTED_HARNESS_PARTICIPANTS | default(value=\"\") }}"
integration_package = "{{ env.INTEGRATION_PACKAGE | default(value=\"./tests/...\") }}"
integration_worker_binary = "{{ vars.root ~ \"/\" ~ vars.cache_dir ~ \"/wallaby-worker-integration\" }}"
snowflake_fuzz_time = "{{ env.SNOWFLAKE_FUZZ_TIME | default(value=\"30s\") }}"
snowflake_fuzz_targets = "{{ env.SNOWFLAKE_FUZZ_TARGETS | default(value=\"FuzzManagedSchemaContractHash FuzzNormalizeManagedSourceType FuzzManagedRecordKey FuzzBuildManagedSnowflakeOperationSQLSafety\") }}"
snowflake_fuzz_rapid_checks = "{{ env.SNOWFLAKE_FUZZ_RAPID_CHECKS | default(value=\"1000\") }}"

[tasks."default"]
description = "List available recipes."
shell = "bash -euo pipefail -c"
run = '''
mise tasks
'''

[tasks."format"]
description = "Format all Go packages."
shell = "bash -euo pipefail -c"
run = '''
{{ vars.go }} fmt ./...
{{ vars.go }} -C terraform/provider fmt ./...
'''

[tasks."format:check"]
description = "Verify Go formatting without modifying the worktree."
shell = "bash -euo pipefail -c"
run = '''
unformatted="$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*' -not -path './.cache/*' -not -path '*/.lake/*'))"; test -z "$unformatted" || { printf 'unformatted Go files:\n%s\n' "$unformatted" >&2; exit 1; }
'''

[tasks."lint"]
description = "Run golangci-lint."
shell = "bash -euo pipefail -c"
run = '''
GOFLAGS="-buildvcs=false" GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" GOLANGCI_LINT_CACHE="{{ vars.golangci_lint_cache }}" {{ vars.golangci_lint }} run ./...
{{ vars.go }} -C terraform/provider vet ./...
'''

[tasks."staticcheck"]
description = "Run staticcheck at the repository-pinned version. Tooling does not need VCS build metadata, and disabling it keeps this gate deterministic in worktrees."
shell = "bash -euo pipefail -c"
run = '''
GOFLAGS="-buildvcs=false" GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} run honnef.co/go/tools/cmd/staticcheck@{{ vars.staticcheck_version }} ./...
'''

[tasks."vulncheck"]
description = "Scan reachable Go code for known vulnerabilities. Tool binaries do not need VCS build metadata and must run identically in the primary tree and worktrees."
shell = "bash -euo pipefail -c"
run = '''
GOFLAGS="-buildvcs=false" GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} run golang.org/x/vuln/cmd/govulncheck@{{ vars.govulncheck_version }} ./...
'''

[tasks."lint-full"]
description = "lint full"
shell = "bash -euo pipefail -c"
run = '''
mise run lint
mise run staticcheck
mise run vulncheck
mise run proto-lint
mise run proto-breaking
'''

[tasks."check"]
description = "check"
shell = "bash -euo pipefail -c"
run = '''
mise run spec-verify
mise run spec-sync
mise run spec-lint
mise run check-tla
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} test ./...
'''

[tasks."check-tla"]
description = "check tla"
shell = "bash -euo pipefail -c"
run = '''
SKIP_TLA_CHECKS="{{ vars.skip_tla_checks }}" MISE="mise" ./scripts/check-tla.sh
'''

[tasks."check-lite"]
description = "check lite"
shell = "bash -euo pipefail -c"
run = '''
mise run spec-sync
mise run spec-lint
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} test ./cmd/wallaby-admin ./pkg/... ./internal/... ./connectors/... ./tests/...
'''

[tasks."check-coverage"]
description = "check coverage"
shell = "bash -euo pipefail -c"
run = '''
mise run spec-sync
mise run tla-coverage
mise run tla-coverage-check
mise run trace-suite
mise run test-e2e
'''

[tasks."test"]
description = "test"
shell = "bash -euo pipefail -c"
run = '''
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" ./scripts/test-go.sh
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" go -C terraform/provider test ./...
'''

[tasks."test-coverage"]
description = "Report per-package unit coverage for root/provider; retain completeness checks, no threshold or live-coverage claim"
shell = "bash -euo pipefail -c"
run = '''
mkdir -p .cache/coverage
GOMODCACHE='{{ vars.gomodcache }}' GOCACHE='{{ vars.gocache }}' GO_UNIT_COVERAGE=1 ./scripts/test-go.sh
GOMODCACHE='{{ vars.gomodcache }}' GOCACHE='{{ vars.gocache }}' go -C terraform/provider test -count=1 -covermode=atomic -coverprofile='../../.cache/coverage/terraform-provider.out' ./...
GOMODCACHE='{{ vars.gomodcache }}' GOCACHE='{{ vars.gocache }}' go tool cover -func=.cache/coverage/root.out > .cache/coverage/root.txt
GOMODCACHE='{{ vars.gomodcache }}' GOCACHE='{{ vars.gocache }}' go -C terraform/provider tool cover -func=../../.cache/coverage/terraform-provider.out > .cache/coverage/terraform-provider.txt
test -s .cache/coverage/root.out
test -s .cache/coverage/terraform-provider.out
'''

[tasks."test-rapid"]
description = "test rapid"
shell = "bash -euo pipefail -c"
run = '''
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" GO="{{ vars.go }}" RAPID_PACKAGES="{{ vars.rapid_packages }}" RAPID_CHECKS="{{ vars.rapid_checks }}" ./scripts/test-rapid.sh
'''

[tasks."build-integration-worker"]
description = "Build the real worker process required by process-kill/restart evidence."
shell = "bash -euo pipefail -c"
run = '''
mkdir -p "$(dirname '{{ vars.integration_worker_binary }}')"
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} build -o "{{ vars.integration_worker_binary }}" ./cmd/wallaby-worker
'''

[tasks."test-integration"]
description = "test integration"
shell = "bash -euo pipefail -c"
run = '''
mise run build-integration-worker
WALLABY_WORKER_BINARY="${WALLABY_WORKER_BINARY:-{{ vars.integration_worker_binary }}}" GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" GO="{{ vars.go }}" GO_TEST_TIMEOUT="{{ vars.go_test_timeout }}" GO_TEST_VERBOSE="{{ vars.go_test_verbose }}" GO_TEST_VERBOSE_FLAG="{{ vars.go_test_verbose_flag }}" IT_KIND="{{ vars.it_kind }}" IT_KEEP="{{ vars.it_keep }}" IT_KIND_CLUSTER="{{ vars.it_kind_cluster }}" IT_KIND_NODE_IMAGE="{{ vars.it_kind_node_image }}" IT_SERVICE_READY_TIMEOUT_SECONDS="{{ vars.it_service_ready_timeout_seconds }}" IT_RUN_FILTER="{{ vars.it_run_filter }}" IT_SKIP_FILTER="{{ vars.it_skip_filter }}" IT_COUNT="{{ vars.it_count }}" IT_PACKAGE_PARALLELISM="{{ vars.it_package_parallelism }}" IT_EXPECTED_HARNESS_PARTICIPANTS="{{ vars.it_expected_harness_participants }}" INTEGRATION_PACKAGE="{{ vars.integration_package }}" ./scripts/test-integration.sh
'''

[tasks."test-integration-ci"]
description = "Broad integration excludes managed ClickHouse/Keeper fault cells. Those run immediately afterward through test-clickhouse-managed-profile with strict required-test/no-skip accounting and an isolated harness identity."
shell = "bash -euo pipefail -c"
run = '''
IT_SKIP_FILTER='^(TestClickHouseManagedProfile|TestPostgresToClickHouseManagedProfile)' mise run test-integration
'''

[tasks."test-durable-pr"]
description = "Durable-core unit and contract gate. Real-service evidence runs separately."
shell = "bash -euo pipefail -c"
run = '''
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} test -count=1 ./internal/authority ./internal/controlplane ./internal/controlstore ./internal/delivery ./internal/bootstrap ./internal/artifactlog ./internal/failmatrix ./internal/workflow ./internal/checkpoint ./internal/registry ./internal/replication ./internal/runner ./pkg/connector ./pkg/stream ./connectors/sources/postgres ./connectors/destinations/postgres ./connectors/destinations/clickhouse ./connectors/destinations/iceberg
'''

[tasks."test-durable-race"]
description = "Race detector coverage for the durable mutation and execution surfaces."
shell = "bash -euo pipefail -c"
run = '''
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} test -race -count=1 ./internal/authority ./internal/controlplane ./internal/controlstore ./internal/delivery ./internal/bootstrap ./internal/artifactlog ./internal/failmatrix ./internal/workflow ./internal/checkpoint ./internal/registry ./internal/replication ./internal/runner ./pkg/connector ./pkg/stream ./connectors/sources/postgres ./connectors/destinations/postgres ./connectors/destinations/iceberg
'''

[tasks."test-durable-seams"]
description = "Behavior-focused durable seam gate. The integration harness provisions real PostgreSQL authority and versioned MinIO; IT_REQUIRED_TESTS makes every named delivery, bootstrap, artifact, consumer, quota, fencing, and GC test no-skip."
shell = "bash -euo pipefail -c"
run = '''
required=
required+='TestCoordinatorRecoverAbsentManifestFailsClosedWithoutPoisoningDeliver'
required+=',TestPostgresCommitBeforeReceiptReconciles'
required+=',TestCoordinatorRecoverReturnsPostgresAuthoritativeCheckpointMetadata'
required+=',TestPostgresGenerationFenceRejectsStaleCommit'
required+=',TestBootstrapRecoveryFailpoints'
required+=',TestManagedBootstrapPublicationReceiptBeforeHandoffRecovery'
required+=',TestManagedBootstrapHandoffBeforeCDCOpenRecovery'
required+=',TestManagedTerminalStopOwnershipLive'
required+=',TestCanonicalArtifactPublicationFailureBoundaries'
required+=',TestCanonicalArtifactStalePublisherCannotCommit'
required+=',TestCanonicalArtifactBackpressureAndRootedRetention'
required+=',TestArtifactConsumerRetryDoesNotBlockReadsBelowBacklogWatermark'
required+=',TestCanonicalArtifactConsumerReceiptBoundaryRecovery'
required+=',TestCanonicalArtifactOrphanMarkSweepCrashRecovery'
filter="^($(printf '%s' "${required}" | tr ',' '|'))$"
mkdir -p .cache/coverage
GO_TEST_COVERPKG='./internal/authority,./internal/delivery,./internal/bootstrap,./internal/artifactlog,./internal/checkpoint' \
  GO_TEST_COVERPROFILE='.cache/coverage/durable-seams.out' \
  IT_REQUIRED_TESTS="${required}" IT_RUN_FILTER="${filter}" INTEGRATION_PACKAGE='./tests' mise run test-integration
test -s .cache/coverage/durable-seams.out
{{ vars.go }} tool cover -func=.cache/coverage/durable-seams.out > .cache/coverage/durable-seams.txt
test -s .cache/coverage/durable-seams.txt
'''

[tasks."test-durable-integration"]
description = "Required live PostgreSQL/MinIO durability profiles. The harness provisions services, so these named tests must run rather than skip."
shell = "bash -euo pipefail -c"
run = '''
WALLABY_WORKER_BINARY="{{ vars.integration_worker_binary }}" IT_REQUIRED_TESTS='TestWallabyWorkerProcessKillRecovery,TestAuthorityProtocolGateRejectsStaleBinarySession,TestPostgresGenerationFenceRejectsStaleCommit,TestPostgresRunFenceValidationSerializesTakeover,TestPostgresCheckpointGenerationFenceRejectsStaleCommit,TestPostgresFlowIDReuseDoesNotRestoreOldState,TestPostgresDestinationRevisionIsImmutable,TestPostgresAckOnlyCheckpointHasIntentAndReceipt,TestPostgresCommitBeforeReceiptReconciles,TestPostgresManagedDriverMarkerReconciles,TestPostgresTargetReplayConvergesIncludingMetadata,TestPostgresTargetPreservesSameKeyOperationOrderIntegration,TestLogicalSlotExportedSnapshotContract,TestBootstrapConcurrentWritesBoundary,TestManagedTerminalStopHardCrashSlotBeforePersist,TestManagedTerminalStopHardCrashPublicationBeforePublish,TestBootstrapRecoveryFailpoints,TestManagedBootstrapWorkerWiringConcurrentBoundary,TestManagedBootstrapSnapshotBatchCommitBeforeReceiptRecovery,TestManagedBootstrapPublicationReceiptBeforeHandoffRecovery,TestManagedBootstrapHandoffBeforeCDCOpenRecovery,TestManagedBootstrapLiveAdmissionMatrix,TestCanonicalPublicationFingerprintLive,TestManagedTerminalStopOwnershipLive,TestRegistryAndDDLReceiptsRejectStaleTakeover,TestCanonicalArtifactS3AdmissionRequiresEnabledVersioning,TestCanonicalArtifactPublicationRecovery,TestCanonicalArtifactPublicationFailureBoundaries,TestCanonicalArtifactBarrierOnlyDelivery,TestCanonicalArtifactStalePublisherCannotCommit,TestCanonicalArtifactBackpressureAndRootedRetention,TestArtifactConsumerRetryDoesNotBlockReadsBelowBacklogWatermark,TestCanonicalArtifactOrphanMarkSweepCrashRecovery,TestCanonicalArtifactGCDoesNotClaimActiveUpload,TestCanonicalArtifactGCTakeoverDoesNotOrphanInFlightPut,TestCanonicalArtifactPublisherGCClaimRevalidation,TestCanonicalArtifactConsumerReceiptBoundaryRecovery,TestCanonicalArtifactConsumerReconcileBoundaryRecovery,TestCanonicalArtifactRandomizedCrashCycles,TestWallabyWorkerMaterializedPublicationRecovery,TestPostgresToPostgresManagedRecoveryContract' IT_RUN_FILTER='^(TestWallabyWorkerProcessKillRecovery|TestAuthorityProtocolGateRejectsStaleBinarySession|TestPostgresGenerationFenceRejectsStaleCommit|TestPostgresRunFenceValidationSerializesTakeover|TestPostgresCheckpointGenerationFenceRejectsStaleCommit|TestPostgresFlowIDReuseDoesNotRestoreOldState|TestPostgresDestinationRevisionIsImmutable|TestPostgresAckOnlyCheckpointHasIntentAndReceipt|TestPostgresCommitBeforeReceiptReconciles|TestPostgresManagedDriverMarkerReconciles|TestPostgresTargetReplayConvergesIncludingMetadata|TestPostgresTargetPreservesSameKeyOperationOrderIntegration|TestLogicalSlotExportedSnapshotContract|TestBootstrapConcurrentWritesBoundary|TestManagedTerminalStopHardCrashSlotBeforePersist|TestManagedTerminalStopHardCrashPublicationBeforePublish|TestBootstrapRecoveryFailpoints|TestManagedBootstrapWorkerWiringConcurrentBoundary|TestManagedBootstrapSnapshotBatchCommitBeforeReceiptRecovery|TestManagedBootstrapPublicationReceiptBeforeHandoffRecovery|TestManagedBootstrapHandoffBeforeCDCOpenRecovery|TestManagedBootstrapLiveAdmissionMatrix|TestCanonicalPublicationFingerprintLive|TestManagedTerminalStopOwnershipLive|TestRegistryAndDDLReceiptsRejectStaleTakeover|TestCanonicalArtifactS3AdmissionRequiresEnabledVersioning|TestCanonicalArtifactPublicationRecovery|TestCanonicalArtifactPublicationFailureBoundaries|TestCanonicalArtifactBarrierOnlyDelivery|TestCanonicalArtifactStalePublisherCannotCommit|TestCanonicalArtifactBackpressureAndRootedRetention|TestArtifactConsumerRetryDoesNotBlockReadsBelowBacklogWatermark|TestCanonicalArtifactOrphanMarkSweepCrashRecovery|TestCanonicalArtifactGCDoesNotClaimActiveUpload|TestCanonicalArtifactGCTakeoverDoesNotOrphanInFlightPut|TestCanonicalArtifactPublisherGCClaimRevalidation|TestCanonicalArtifactConsumerReceiptBoundaryRecovery|TestCanonicalArtifactConsumerReconcileBoundaryRecovery|TestCanonicalArtifactRandomizedCrashCycles|TestWallabyWorkerMaterializedPublicationRecovery|TestPostgresToPostgresManagedRecoveryContract)$' INTEGRATION_PACKAGE='./tests' mise run test-integration
'''

[tasks."test-durable-dbos-integration"]
description = "Live DBOS evidence for the production managed-bootstrap wiring."
shell = "bash -euo pipefail -c"
run = '''
IT_REQUIRED_TESTS='TestDBOSManagedBootstrapProductionWiring' IT_RUN_FILTER='^TestDBOSManagedBootstrapProductionWiring$' INTEGRATION_PACKAGE='./tests/integration' mise run test-integration
'''

[tasks."test-checkpoint1-integration"]
description = "Checkpoint-1 requires both direct worker and in-process DBOS evidence. Use distinct per-run harness identities so the sequential phases cannot reuse port-forward state from infrastructure torn down by the preceding phase."
shell = "bash -euo pipefail -c"
run = '''
harness_base="${IT_KIND_CLUSTER:-wallaby-test}-checkpoint1-$$"
cleanup() {
    status=$?
    if [[ "${IT_KEEP:-0}" != "1" ]]; then
        if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name "${harness_base}-direct" || true
            kind delete cluster --name "${harness_base}-dbos" || true
        fi
    fi
    return "$status"
}
trap cleanup EXIT
IT_KIND_CLUSTER="${harness_base}-direct" mise run test-durable-integration
IT_KIND_CLUSTER="${harness_base}-dbos" mise run test-durable-dbos-integration
'''

[tasks."test-checkpoint2-postgres-profile"]
description = "Checkpoint-2 named PostgreSQL profile gate. CI runs this recipe against every admitted PostgreSQL major. JSON verification makes missing or skipped evidence fail instead of letting a stale -run expression pass vacuously."
shell = "bash -euo pipefail -c"
run = '''
test -n "${TEST_PG_DSN:-}" || { echo 'TEST_PG_DSN is required' >&2; exit 2; }
mkdir -p "$(dirname '{{ vars.integration_worker_binary }}')"
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} build -o "{{ vars.integration_worker_binary }}" ./cmd/wallaby-worker
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} run ./scripts/apply-control-migrations.go
results=$(mktemp)
trap 'rm -f "${results}"' EXIT
required=
required+='TestManagedProfileCannotBypassManagedAdmission'
required+=',TestPostgresManagedProfileVersionContract'
required+=',TestPostgresManagedStreamedSubtransactionAbort'
required+=',TestPostgresManagedProfileTargetAdmission'
required+=',TestPostgresManagedProfileDestinationSchemaEvolution'
required+=',TestPostgresManagedProfileDDLTargetMapping'
required+=',TestPostgresManagedProfileDDLCommitReconciliation'
required+=',TestPostgresManagedTargetRejectsLegacyReceiptSchemaWithoutMutation'
required+=',TestPostgresManagedFullTransactionPreservesFragmentsAndMarker'
required+=',TestPostgresManagedTransactionCommitBeforeReceiptReconciles'
required+=',TestPostgresManagedOverlappingTakeoverAdoptsConcurrentCommit'
required+=',TestPostgresManagedDeliveryRetryAndRetention'
required+=',TestManagedDeliveryRetentionRunsDuringLongLivedFlow'
required+=',TestPostgresAuthorizedSourceFlushRejectsStaleWorker'
required+=',TestPostgresToPostgresManagedRecoveryContract'
required+=',TestManagedBootstrapWorkerWiringConcurrentBoundary'
required+=',TestPostgresManagedProfileSourceSchemaEvolutionAfterRestart'
required+=',TestWallabyWorkerProcessKillRecovery'
required+=',TestPostgresManagedProfilePoolExhaustion'
required+=',TestManagedReceiptReconcilesLogicalAndPositionIdentities'
required+=',TestPostgresManagedProfileMetrics'
required+=',TestFencedSchemaRegistrationScopesCatalogAndFlowProvenance'
required+=',TestPostgresToPostgresE2E'
required+=',TestControlStoreMigrationLedgerDoesNotReplaySQL'
required+=',TestDeliveryManifestAuthorityTamperCurrentPGMajor'
filter="^($(printf '%s' "${required}" | tr ',' '|'))$"
set +e
WALLABY_WORKER_BINARY="{{ vars.integration_worker_binary }}" GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" \
  {{ vars.go }} test -p 1 -count=1 -json \
  ./tests ./tests/integration ./internal/runner ./internal/replication ./connectors/destinations/postgres ./internal/telemetry ./internal/controlstore ./internal/controlplane \
  -run "${filter}" >"${results}"
test_rc=$?
set -e
cat "${results}"
test "${test_rc}" -eq 0
GOMODCACHE="{{ vars.gomodcache }}" GOCACHE="{{ vars.gocache }}" {{ vars.go }} run ./scripts/verify-go-test-json.go \
  -results "${results}" -required "${required}"
